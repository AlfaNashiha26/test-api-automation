name: Playwright API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 1. Penjadwalan Otomatis (Cron Job): Jalan setiap hari pukul 08:00 WIB (01:00 UTC)
  schedule:
    - cron: '0 1 * * *'
  # 2. Manual Trigger: Memunculkan tombol "Run workflow" di tab GitHub Actions
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright API tests
        id: run_tests
        run: npx playwright test

      # 3. Ringkasan Otomatis di Halaman GitHub Actions Summary
      - name: Generate Test Summary Report
        if: always()
        run: |
          echo "## 📊 Ringkasan Eksekusi API Automation" >> $GITHUB_STEP_SUMMARY
          echo "- **Status Eksekusi:** ${{ steps.run_tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Waktu (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      # 4. Kirim Notifikasi Otomatis ke Telegram
      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ steps.run_tests.outcome }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅ PASSED"
          else
            ICON="❌ FAILED"
          fi

          MESSAGE="🤖 <b>Playwright Automation Report</b>%0A%0A<b>Repo:</b> ${{ github.repository }}%0A<b>Status:</b> ${ICON}%0A<b>Trigger:</b> ${{ github.event_name }}%0A<b>Branch:</b> ${{ github.ref_name }}%0A<b>Detail:</b> https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          RESPONSE=$(curl -s -f --retry 3 --retry-delay 35 --retry-all-errors -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML")

          echo "Telegram API Response: $RESPONSE"